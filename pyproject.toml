[project]
name = "company-operator"
version = "0.1.0"
description = "An AI employee that turns company requests into completed, verified work."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "playwright>=1.47",
    "pyyaml>=6.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[project.scripts]
company-operator = "company_operator.api.app:main"
quickbite-sandbox = "sandbox.quickbite.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["company_operator", "sandbox"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Line length is enforced by the formatter; long SQL and message strings are left intact.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["company_operator", "sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
